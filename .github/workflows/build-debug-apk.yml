name: Build AI Studio Debug APK

on:
  push:
    branches: [ main, master ]  # Fires automatically whenever you push code
  workflow_dispatch:            # Allows you to click a button to build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'     # Native AI Studio Kotlin apps utilize JDK 17+
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Studio-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
