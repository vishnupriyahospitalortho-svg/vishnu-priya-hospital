name: Fix AI Studio Build Failure #3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    # Fix 1: Maximize internal heap sizes to prevent out-of-memory container crashes
    - name: Tune Compiler Memory Limits
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC" >> ~/.gradle/gradle.properties
        echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties

    # Fix 2: AI Studio architectures natively mandate modern JDK environments
    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17' 
        cache: gradle

    - name: Grant Execute Permission
      run: chmod +x gradlew

    # Fix 3: De-duplicate dynamic configurations and build cleanly
    - name: Execute Resilient Android Compile
      run: ./gradlew clean assembleDebug --no-daemon --stacktrace
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Studio-Fixed-APK
        path: app/build/outputs/apk/debug/*.apk

   
     
