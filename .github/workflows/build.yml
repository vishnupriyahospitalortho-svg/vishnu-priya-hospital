name: Build & Sign App from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this manually by clicking a button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip *.zip -d project_folder
        # Move files to root if they are nested inside a folder
        if [ -d project_folder/* ]; then
          mv project_folder/*/* . 2>/dev/null || mv project_folder/* .
        else
          mv project_folder/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Grant Gradle execution permission
      run: chmod +x ./gradlew

    - name: Build and Sign Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished App
      uses: actions/upload-artifact@v4
      with:
        name: my-finished-app
        path: app/build/outputs/apk/debug/*.apk

